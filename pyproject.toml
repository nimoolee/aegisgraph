[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-graph"
version = "1.0.1"
description = "Semantic verification and change-proof engine for AI-generated code"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "ai-coding-agent",
  "semantic-verification",
  "architecture-drift",
  "invariants",
  "change-impact",
  "code-review",
  "guardrails",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nimoolee/aegisgraph"
Repository = "https://github.com/nimoolee/aegisgraph"
Issues = "https://github.com/nimoolee/aegisgraph/issues"

[project.scripts]
aegis = "aegis_graph.cli:console_main"

[project.optional-dependencies]
dev = [
  "bandit>=1.8",
  "build>=1.2",
  "mypy>=1.18",
  "pytest>=8.0",
  "ruff>=0.14",
  "twine>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RUF"]
ignore = [
  "E501",   # Embedded self-contained HTML/JS intentionally contains long lines.
  "RUF001", # Bilingual UI text intentionally uses CJK punctuation.
  "UP042",  # Keep public str+Enum behavior stable in the v1 API.
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
