[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-graph"
version = "1.0.0"
description = "Semantic verification and change-proof engine for AI-generated code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = [
  "ai-coding-agent",
  "semantic-verification",
  "architecture-drift",
  "invariants",
  "change-impact",
  "code-review",
  "guardrails",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nimoolee/aegisgraph"
Repository = "https://github.com/nimoolee/aegisgraph"
Issues = "https://github.com/nimoolee/aegisgraph/issues"

[project.scripts]
aegis = "aegis_graph.cli:console_main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
