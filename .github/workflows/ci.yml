name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'uv==0.12.13'
      - run: uv sync --locked --all-extras --python python
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/aegis demo
      - run: .venv/bin/aegis check .

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.12.13'
      - run: uv sync --locked --all-extras --python python
      - run: .venv/bin/ruff check src tests examples
      - run: .venv/bin/mypy src/aegis_graph
      - run: .venv/bin/bandit -q -r src/aegis_graph
      - run: .venv/bin/python -m build
      - run: .venv/bin/twine check dist/*
