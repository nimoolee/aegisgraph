name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'uv==0.12.13'
      - run: uv sync --locked --all-extras --python python
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/aegis demo
      - run: .venv/bin/aegis check .

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.12.13'
      - run: uv sync --locked --all-extras --python python
      - run: .venv/bin/ruff check src tests examples
      - run: .venv/bin/mypy src/aegis_graph
      - run: .venv/bin/bandit -q -r src/aegis_graph
      - run: .venv/bin/python -m build
      - run: .venv/bin/twine check dist/*
